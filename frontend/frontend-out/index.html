<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock MS · Sign In</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrap">

  <div class="login-logo">Stock Management System</div>
  <div class="login-tagline">University of Hyderabad · SCIS</div>

  <div class="login-card">
    <div class="login-card-title">Sign in</div>
    <div class="login-card-sub">Enter your university credentials to continue</div>

    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-input" id="email" type="email" placeholder="you@university.edu" autocomplete="email">
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" id="pass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn-primary" id="loginBtn" onclick="login()">Continue</button>

    <div class="form-error" id="err"></div>
  </div>

</div>

<script src="js/app.js"></script>
<script>
  if (App.user) location.href = 'dashboard.html';

  async function login() {
    const email = document.getElementById('email').value.trim();
    const pass  = document.getElementById('pass').value;
    const err   = document.getElementById('err');
    const btn   = document.getElementById('loginBtn');
    err.style.display = 'none';

    if (!email || !pass) {
      err.textContent = 'Please enter email and password.';
      err.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
      await App.login(email, pass);
      location.href = 'dashboard.html';
    } catch (e) {
      err.textContent = e.message === 'HTTP 401' ? 'Invalid email or password.' : (e.message || 'Login failed.');
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Continue';
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
